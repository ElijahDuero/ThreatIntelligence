<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" role="img" aria-label="Darkdump Threat Intelligence Radar">
  <defs>
    <!-- Background Gradient inside the circle -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#090d16" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>

    <!-- Ambient Gold Core Flare -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Sweeping Radar Beam -->
    <conicGradient id="radarSweep" cx="200" cy="200">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0" />
      <stop offset="75%" stop-color="#f59e0b" stop-opacity="0" />
      <stop offset="85%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.45" />
    </conicGradient>

    <!-- Linear Metallic Cyber Gold -->
    <linearGradient id="cyberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Center Core Radial -->
    <linearGradient id="coreBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Text Path for Telemetry Ring -->
    <path id="telemetryTrack" d="M 200,200 m -160,0 a 160,160 0 1,1 320,0 a 160,160 0 1,1 -320,0" fill="none" />
  </defs>

  <style>
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes radarPulse {
      0%, 100% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.65; transform: scale(1.02); }
    }
    @keyframes blipPing {
      0% { r: 2; opacity: 1; }
      70% { r: 9; opacity: 0; }
      100% { r: 2; opacity: 0; }
    }
    .rot-clockwise-slow {
      transform-origin: 200px 200px;
      animation: spinClockwise 28s linear infinite;
    }
    .rot-counter-slow {
      transform-origin: 200px 200px;
      animation: spinCounter 40s linear infinite;
    }
    .rot-sweep {
      transform-origin: 200px 200px;
      animation: spinClockwise 4.5s linear infinite;
    }
    .rot-tachometer {
      transform-origin: 200px 200px;
      animation: spinClockwise 16s linear infinite;
    }
    .rot-reverse-arcs {
      transform-origin: 200px 200px;
      animation: spinCounter 12s linear infinite;
    }
    .pulse-glow {
      transform-origin: 200px 200px;
      animation: radarPulse 3.5s ease-in-out infinite;
    }
    .blip-1 { animation: blipPing 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    .blip-2 { animation: blipPing 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite 1.1s; }
  </style>

  <!-- 1. Pure Circular Background & Ambient Gold Glow (ZERO SQUARE CORNERS) -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGlow)" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.8" />
  <circle cx="200" cy="200" r="190" fill="url(#goldGlow)" class="pulse-glow" />

  <!-- 2. Outer Reticle Frame & Cardinal Ticks -->
  <circle cx="200" cy="200" r="186" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.35" />
  <circle cx="200" cy="200" r="182" fill="none" stroke="#f59e0b" stroke-width="0.75" stroke-dasharray="2 6" stroke-opacity="0.4" />
  
  <g stroke="#fbbf24" stroke-width="1.8" opacity="0.7">
    <line x1="200" y1="8" x2="200" y2="24" />
    <line x1="200" y1="376" x2="200" y2="392" />
    <line x1="8" y1="200" x2="24" y2="200" />
    <line x1="376" y1="200" x2="392" y2="200" />
  </g>

  <!-- 3. Active Sweeping Radar Cone & Sector Beam -->
  <g class="rot-sweep">
    <path d="M 200 200 L 200 18 A 182 182 0 0 1 328 72 Z" fill="url(#cyberGold)" opacity="0.22" />
    <line x1="200" y1="200" x2="200" y2="18" stroke="#fef08a" stroke-width="2" opacity="0.85" />
  </g>

  <!-- 4. Layer A: Rotating Calibration Ring with Degree Blips -->
  <g class="rot-clockwise-slow">
    <circle cx="200" cy="200" r="172" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3 10" stroke-opacity="0.45" />
    <circle cx="200" cy="200" r="168" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="70 25 110 35" stroke-opacity="0.65" />
    <circle cx="200" cy="28" r="3.5" fill="#fbbf24" />
    <circle cx="372" cy="200" r="3.5" fill="#fbbf24" />
    <circle cx="200" cy="372" r="3.5" fill="#fbbf24" />
    <circle cx="28" cy="200" r="3.5" fill="#fbbf24" />
  </g>

  <!-- 5. Layer B: Outer Telemetry Text Ring (Counter-Clockwise) -->
  <g class="rot-counter-slow">
    <text font-family="'Courier New', monospace" font-size="8.2" font-weight="900" fill="#fbbf24" letter-spacing="3.2" opacity="0.85">
      <textPath href="#telemetryTrack" startOffset="0%">
        ● DARKDUMP OSINT V5 ● RECON ENCRYPTED ● TOR ROUTING ACTIVE ● 256-BIT SOCKS5 ● ZERO FOOTPRINT ●
      </textPath>
    </text>
  </g>

  <!-- 6. Layer C: Segmented Tachometer Arcs -->
  <g class="rot-tachometer">
    <circle cx="200" cy="200" r="144" fill="none" stroke="url(#cyberGold)" stroke-width="2.5" stroke-dasharray="100 40 70 50" stroke-linecap="round" opacity="0.8" />
    <circle cx="200" cy="200" r="139" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3 8" opacity="0.4" />
  </g>

  <!-- 7. Layer D: Fast Cyan Cross-Arcs & Data Hash Ring -->
  <g class="rot-reverse-arcs">
    <circle cx="200" cy="200" r="124" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="35 75 55 65" stroke-linecap="round" opacity="0.6" />
    <circle cx="200" cy="200" r="120" fill="none" stroke="#f59e0b" stroke-width="0.6" stroke-dasharray="2 6" opacity="0.35" />
  </g>

  <!-- 8. Radar Blips / Discovered Targets -->
  <!-- Target 1: Onion Hidden Service -->
  <g transform="translate(276, 114)">
    <circle cx="0" cy="0" r="6" fill="#f59e0b" opacity="0.3" class="blip-1" />
    <circle cx="0" cy="0" r="2.5" fill="#fbbf24" />
    <rect x="8" y="-7" width="50" height="13" rx="3" fill="#020617" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.8" />
    <text x="13" y="2.5" font-family="'Courier New', monospace" font-size="6.5" font-weight="bold" fill="#fde68a">ONION.01</text>
  </g>

  <!-- Target 2: SOCKS5 Active Node -->
  <g transform="translate(108, 276)">
    <circle cx="0" cy="0" r="6" fill="#38bdf8" opacity="0.3" class="blip-2" />
    <circle cx="0" cy="0" r="2.5" fill="#38bdf8" />
    <rect x="-70" y="-7" width="62" height="13" rx="3" fill="#020617" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.8" />
    <text x="-65" y="2.5" font-family="'Courier New', monospace" font-size="6.5" font-weight="bold" fill="#7dd3fc">SOCKS5:9050</text>
  </g>

  <!-- Target 3: Micro Ping Target -->
  <g transform="translate(126, 136)">
    <circle cx="0" cy="0" r="2" fill="#34d399" />
    <circle cx="0" cy="0" r="4" fill="none" stroke="#34d399" stroke-width="0.75" opacity="0.7" />
  </g>

  <!-- 9. Center Glass Cyber Seal Core -->
  <g>
    <!-- Core Outer Border with Inner Drop Shadow -->
    <circle cx="200" cy="200" r="74" fill="url(#coreBg)" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.85" />
    <circle cx="200" cy="200" r="70" fill="none" stroke="#fbbf24" stroke-width="0.75" stroke-opacity="0.4" stroke-dasharray="4 4" />
    
    <!-- Terminal Prompt Icon -->
    <g transform="translate(182, 142)">
      <polyline points="7,8 17,16 7,24" fill="none" stroke="#fbbf24" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="22" y1="24" x2="31" y2="24" stroke="#fbbf24" stroke-width="2.8" stroke-linecap="round" />
    </g>

    <!-- Brand Typography -->
    <text x="200" y="196" text-anchor="middle" font-family="'Cinzel', 'Georgia', serif" font-weight="900" font-size="13.5" fill="#fde68a" letter-spacing="2">DARKDUMP</text>
    <text x="200" y="209" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="7.5" fill="#94a3b8" letter-spacing="2.2">OSINT MATRIX</text>

    <!-- Equalizer Audio / Data Waveform Bars -->
    <g transform="translate(186, 218)">
      <rect x="0" y="2" width="3" height="7" rx="1.5" fill="#f59e0b" />
      <rect x="6" y="0" width="3" height="11" rx="1.5" fill="#fbbf24" />
      <rect x="12" y="-2" width="3" height="15" rx="1.5" fill="#fef08a" />
      <rect x="18" y="0" width="3" height="11" rx="1.5" fill="#fbbf24" />
      <rect x="24" y="2" width="3" height="7" rx="1.5" fill="#f59e0b" />
    </g>

    <!-- Operational Status Pill -->
    <g transform="translate(169, 239)">
      <rect x="0" y="0" width="62" height="14" rx="7" fill="#020617" stroke="#f59e0b" stroke-width="0.9" stroke-opacity="0.5" />
      <circle cx="9" cy="7" r="2.5" fill="#34d399" />
      <text x="17" y="10" font-family="'Courier New', monospace" font-size="6.8" font-weight="900" fill="#fde68a" letter-spacing="0.5">CORE LIVE</text>
    </g>
  </g>
</svg>
